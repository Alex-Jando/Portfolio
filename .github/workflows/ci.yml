name: CI

# Validation only. This workflow never deploys.
# Production deploys are handled by Vercel's own GitHub integration on master.
on:
  push:
    branches-ignore:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Skips the LaTeX step so CI does not need Tectonic installed.
      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
