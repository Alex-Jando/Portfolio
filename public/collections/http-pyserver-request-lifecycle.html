<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTTP-PyServer request lifecycle</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #07111f;
      color: #e8f0fa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; }
    svg { display: block; width: 100%; height: auto; }
    .connector { fill: none; stroke: #64748b; stroke-width: 2; }
    .box { stroke-width: 1.5; rx: 10; }
    .external { fill: #10233e; stroke: #4e7db7; }
    .process { fill: #102b28; stroke: #45a390; }
    .state { fill: #2a2038; stroke: #9575bd; }
    .wire { fill: #241e18; stroke: #b68a56; }
    .label { fill: #f4f7fb; font-size: 17px; font-weight: 700; text-anchor: middle; }
    .detail { fill: #a9b7c8; font-size: 12px; text-anchor: middle; }
    .payload { fill: #73d2c0; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .heading { fill: #ffffff; font-size: 22px; font-weight: 700; }
    .subheading { fill: #93a4b8; font-size: 12px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
    <title id="title">HTTP-PyServer request lifecycle</title>
    <desc id="desc">A browser sends bytes over TCP to a listening socket. The server parses the request, matches a route, runs a handler with shared session and cache state, serializes the response, and sends bytes back.</desc>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
      </marker>
    </defs>

    <text class="heading" x="48" y="54">From bytes to a response</text>
    <text class="subheading" x="48" y="79">The control flow implemented with Python’s standard library</text>

    <path class="connector" marker-end="url(#arrow)" d="M176 203 H229"/>
    <path class="connector" marker-end="url(#arrow)" d="M379 203 H432"/>
    <path class="connector" marker-end="url(#arrow)" d="M582 203 H635"/>
    <path class="connector" marker-end="url(#arrow)" d="M785 203 H838"/>
    <path class="connector" marker-end="url(#arrow)" d="M710 260 V330"/>
    <path class="connector" marker-end="url(#arrow)" d="M635 376 H545"/>
    <path class="connector" marker-end="url(#arrow)" d="M432 376 H342"/>
    <path class="connector" marker-end="url(#arrow)" d="M229 376 H176"/>
    <path class="connector" marker-end="url(#arrow)" d="M710 260 C710 295 710 305 710 330"/>
    <path class="connector" marker-end="url(#arrow)" d="M710 455 V485 H507 V443"/>
    <path class="connector" marker-end="url(#arrow)" d="M860 260 V485 H809 V443"/>

    <rect class="box external" x="48" y="153" width="128" height="100"/>
    <text class="label" x="112" y="194">Client</text>
    <text class="detail" x="112" y="219">browser / curl</text>

    <rect class="box wire" x="229" y="153" width="150" height="100"/>
    <text class="label" x="304" y="194">TCP socket</text>
    <text class="detail" x="304" y="219">accept + recv</text>

    <rect class="box process" x="432" y="153" width="150" height="100"/>
    <text class="label" x="507" y="194">Request</text>
    <text class="detail" x="507" y="219">method · path · headers</text>

    <rect class="box process" x="635" y="153" width="150" height="100"/>
    <text class="label" x="710" y="194">Router</text>
    <text class="detail" x="710" y="219">exact + wildcard match</text>

    <rect class="box process" x="838" y="153" width="74" height="100"/>
    <text class="label" x="875" y="194">Run</text>
    <text class="detail" x="875" y="219">handler</text>

    <rect class="box process" x="635" y="330" width="150" height="92"/>
    <text class="label" x="710" y="368">Response</text>
    <text class="detail" x="710" y="393">status · headers · body</text>

    <rect class="box wire" x="432" y="330" width="150" height="92"/>
    <text class="label" x="507" y="368">Serialize</text>
    <text class="detail" x="507" y="393">HTTP bytes</text>

    <rect class="box wire" x="229" y="330" width="150" height="92"/>
    <text class="label" x="304" y="368">sendall()</text>
    <text class="detail" x="304" y="393">write to connection</text>

    <rect class="box external" x="48" y="330" width="128" height="92"/>
    <text class="label" x="112" y="368">Client</text>
    <text class="detail" x="112" y="393">renders result</text>

    <rect class="box state" x="748" y="455" width="122" height="62"/>
    <text class="label" x="809" y="482">Sessions</text>
    <text class="detail" x="809" y="503">identity + expiry</text>

    <rect class="box state" x="446" y="455" width="122" height="62"/>
    <text class="label" x="507" y="482">Cache</text>
    <text class="detail" x="507" y="503">shared timed state</text>

    <text class="payload" x="202" y="190">request bytes →</text>
    <text class="payload" x="202" y="363">← response bytes</text>
  </svg>
</body>
</html>
